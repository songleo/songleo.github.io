<link href='{{ "/images/fav.png" | relative_url }}' rel='shortcut icon'>
<link href='{{ "/stylesheets/style.css" | relative_url }}' rel='stylesheet' type='text/css' />
<link href='{{ "/stylesheets/syntax.css" | relative_url }}' rel='stylesheet' type='text/css' />
<link href='{{ "/stylesheets/responsive.css" | relative_url }}' rel='stylesheet' type='text/css' />
<!-- - -->
<script src='{{ "/javascripts/jquery.js" | relative_url }}' type='text/javascript'></script>
<script src='{{ "/javascripts/pd.js" | relative_url }}' type='text/javascript'></script>
<script src='{{ "/javascripts/basics.js" | relative_url }}' type='text/javascript'></script>
<!-- - -->
<meta content='width=device-width, initial-scale=1.0, user-scalable=no' name='viewport'>
<meta content='text/html; charset=utf-8' http-equiv='content-type' />
<meta content="{{ site.url }}/og.png" property="og:image" />

{% if page.date %}
  <meta content='{{ site.url }}{{ page.url }}' property='og:url' />
  <meta content="{{ page.content | strip_html | strip_newlines | truncate: 120 }}" property='og:description' />
  <meta content="article" property="og:type" />
{% else %}
  <meta content='{{ site.url }}' property='og:url' />
  <meta content="{{ site.description }}" property='og:description' />
  <meta content="blog" property="og:type" />
{% endif %}
<!-- - -->
{% include ga.html %}
